<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project & Task Management Portal</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-layer-group"></i> TaskPulsePro
            </div>
            <div class="project-section">
                <div class="project-header">
                    <span>Projects</span>
                    <button id="add-project-btn" title="Add Project"><i class="fa-solid fa-plus"></i></button>
                </div>
                <ul id="project-list" class="project-list">
                    <!-- Dynamic Projects -->
                </ul>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="main-content">
            <!-- Top Header -->
            <header class="top-header">
                <div class="header-left">
                    <h1 id="current-project-title">All Tasks</h1>
                    <p id="current-project-desc">Manage all tasks across your workspace</p>
                </div>
                <div class="header-right">
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="search-input" placeholder="Search tasks...">
                    </div>
                    <button class="btn btn-secondary" id="theme-toggle-btn" title="Toggle Dark/Light Mode">
                        <i class="fa-solid fa-moon" id="theme-icon"></i>
                    </button>
                    <button class="btn btn-primary" id="open-task-modal-btn">
                        <i class="fa-solid fa-plus"></i> New Task
                    </button>
                </div>
            </header>

            <!-- Dashboard Statistics -->
            <section class="stats-bar">
                <div class="stat-card">
                    <span class="stat-num" id="stat-total">0</span>
                    <span class="stat-label">Total Tasks</span>
                </div>
                <div class="stat-card">
                    <span class="stat-num" id="stat-todo">0</span>
                    <span class="stat-label">To Do</span>
                </div>
                <div class="stat-card">
                    <span class="stat-num" id="stat-progress">0</span>
                    <span class="stat-label">In Progress</span>
                </div>
                <div class="stat-card">
                    <span class="stat-num" id="stat-done">0</span>
                    <span class="stat-label">Completed</span>
                </div>
            </section>

            <!-- Kanban Board -->
            <section class="kanban-board">
                <!-- To Do Column -->
                <div class="kanban-column" data-status="todo">
                    <div class="column-header">
                        <h2><i class="fa-regular fa-circle"></i> To Do</h2>
                        <span class="task-count" id="count-todo">0</span>
                    </div>
                    <div class="task-list" id="list-todo" ondragover="allowDrop(event)" ondrop="drop(event, 'todo')"></div>
                </div>

                <!-- In Progress Column -->
                <div class="kanban-column" data-status="in-progress">
                    <div class="column-header">
                        <h2><i class="fa-solid fa-spinner"></i> In Progress</h2>
                        <span class="task-count" id="count-in-progress">0</span>
                    </div>
                    <div class="task-list" id="list-in-progress" ondragover="allowDrop(event)" ondrop="drop(event, 'in-progress')"></div>
                </div>

                <!-- Completed Column -->
                <div class="kanban-column" data-status="completed">
                    <div class="column-header">
                        <h2><i class="fa-regular fa-circle-check"></i> Completed</h2>
                        <span class="task-count" id="count-completed">0</span>
                    </div>
                    <div class="task-list" id="list-completed" ondragover="allowDrop(event)" ondrop="drop(event, 'completed')"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- Create/Edit Task Modal -->
    <div class="modal-overlay" id="task-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Create New Task</h3>
                <button class="close-btn" id="close-modal-btn">&times;</button>
            </div>
            <form id="task-form">
                <input type="hidden" id="task-id">
                <div class="form-group">
                    <label for="task-title">Title</label>
                    <input type="text" id="task-title" required placeholder="Task title">
                </div>
                <div class="form-group">
                    <label for="task-desc">Description</label>
                    <textarea id="task-desc" rows="3" placeholder="Brief description..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="task-project">Project</label>
                            <select id="task-project" required></select>
                            <input type="text" id="custom-project-name" placeholder="Enter new project name..." style="display: none; margin-top: 8px;">
                    </div>
                    <div class="form-group">
                        <label for="task-priority">Priority</label>
                        <select id="task-priority">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="task-status">Status</label>
                        <select id="task-status">
                            <option value="todo">To Do</option>
                            <option value="in-progress">In Progress</option>
                            <option value="completed">Completed</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="task-due">Due Date</label>
                        <input type="date" id="task-due">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
